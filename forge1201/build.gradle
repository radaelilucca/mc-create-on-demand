plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

def minecraft_version = forge_minecraft_version
def java_version = forge_java_version
def create_version = forge_create_version
def ponder_version = forge_ponder_version
def flywheel_version = forge_flywheel_version
def registrate_version = forge_registrate_version

group = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-forge-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('runs/gametest')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) { transitive = false }
    runtimeOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) { transitive = false }
    compileOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    runtimeOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    compileOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    runtimeOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation("io.github.llamalad7:mixinextras-forge:${forge_mixinextras_version}")
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')
}

mixin {
    add sourceSets.main, 'create_on_demand.refmap.json'
    config 'create_on_demand.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

processResources {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    def properties = [
        version: "${mod_version}+${minecraft_version}", mod_id: mod_id,
        mod_name: mod_name, mod_description: mod_description,
        mod_authors: mod_authors, mod_license: mod_license,
        minecraft_version: minecraft_version, forge_version: forge_version
    ]
    inputs.properties(properties)
    filesMatching('META-INF/mods.toml') { expand(properties) }
    filesMatching('pack.mcmeta') { expand(properties) }
}

jar {
    manifest.attributes(['MixinConfigs': 'create_on_demand.mixins.json'])
    finalizedBy 'reobfJar'
}

sourceSets {
    demandGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Opt in only for verification runs; these classes and structures are excluded from the mod JAR.
if (project.hasProperty('demandGameTests')) {
    minecraft.runs.configureEach {
        mods { "${mod_id}" { source sourceSets.demandGameTest } }
    }
    minecraft.runs.gameTestServer {
        property 'forge.enabledGameTestNamespaces', mod_id
        mods { "${mod_id}" { source sourceSets.demandGameTest } }
    }
}

// Shared Java 17 demand planner, independent of Minecraft and loader APIs.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')

sourceSets {
    demandTest {
        java.srcDir rootProject.file('common/src/test/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('demandTest', JavaExec) {
    group = 'verification'
    description = 'Runs the shared demand planning and queue scenarios.'
    dependsOn tasks.named('demandTestClasses')
    classpath = sourceSets.demandTest.runtimeClasspath
    mainClass = 'com.radaeli.createondemand.demand.DemandEngineTests'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version as int) }
}
tasks.named('check') { dependsOn tasks.named('demandTest') }
