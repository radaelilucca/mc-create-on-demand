plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

def minecraft_version = neoforge_minecraft_version
def java_version = neoforge_java_version
def create_version = neoforge_create_version
def ponder_version = neoforge_ponder_version
def flywheel_version = neoforge_flywheel_version
def registrate_version = neoforge_registrate_version

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

dependencies {
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

sourceSets {
    demandGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Opt in only for verification runs; these classes and structures are excluded from the mod JAR.
if (project.hasProperty('demandGameTests')) {
    neoForge.mods.named(mod_id) { sourceSet sourceSets.demandGameTest }
    neoForge.runs.named('gameTestServer') {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }
}

// Shared Java 17 demand planner, independent of Minecraft and loader APIs.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')

sourceSets {
    demandTest {
        java.srcDir rootProject.file('common/src/test/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('demandTest', JavaExec) {
    group = 'verification'
    description = 'Runs the shared demand planning and queue scenarios.'
    dependsOn tasks.named('demandTestClasses')
    classpath = sourceSets.demandTest.runtimeClasspath
    mainClass = 'com.radaeli.createondemand.demand.DemandEngineTests'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version as int) }
}
tasks.named('check') { dependsOn tasks.named('demandTest') }
